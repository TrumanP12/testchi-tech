<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FriendStack - Shared Albums</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #FAFAFA;
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Smooth image interactions */
        .photo-card img {
            transition: transform 0.4s ease;
        }
        .photo-card:hover img {
            transform: scale(1.05);
        }
        
        /* Modal transitions */
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 200ms, transform 200ms; }
        .modal-exit { opacity: 1; transform: scale(1); }
        .modal-exit-active { opacity: 0; transform: scale(0.95); transition: opacity 200ms, transform 200ms; }
    </style>
</head>
<body class="text-gray-900 h-screen flex flex-col md:flex-row overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-full md:w-80 lg:w-96 bg-white border-b md:border-b-0 md:border-r border-gray-200 flex flex-col h-auto md:h-full z-10 shadow-sm relative shrink-0">
        <div class="p-6 flex-1 overflow-y-auto flex flex-col gap-8">
            
            <!-- Branding & Header -->
            <div>
                <div class="flex items-center gap-2 mb-6">
                    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold shadow-md">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4 3a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V5a2 2 0 00-2-2H4zm12 12H4l4-8 3 6 2-4 3 6z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <span class="font-bold text-lg text-gray-800 tracking-tight">FriendStack</span>
                </div>
                
                <h1 class="text-3xl font-bold text-gray-900 mb-2 leading-tight">Friday Night Lights</h1>
                <p class="text-sm text-gray-500"><span id="photo-count">0</span> photos • Real-time Sync</p>
            </div>

            <!-- Share Section -->
            <div class="bg-indigo-50/50 rounded-xl p-5 border border-indigo-100">
                <h3 class="text-sm font-semibold text-indigo-900 mb-1">Anyone with the link can add photos</h3>
                <p class="text-xs text-indigo-600 mb-3">No account required. Simple & easy.</p>
                
                <div class="flex gap-2">
                    <input type="text" id="share-link" readonly 
                        class="w-full bg-white text-gray-700 text-sm px-3 py-2 rounded-lg border border-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-500/50 truncate">
                    <button onclick="copyLink()" 
                        class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-sm whitespace-nowrap active:scale-95">
                        Copy
                    </button>
                </div>
            </div>

            <!-- Add Photo Button -->
            <button onclick="openAddModal()" class="w-full bg-gray-900 hover:bg-gray-800 text-white py-3 rounded-xl font-medium shadow-md transition-all active:scale-95 flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
                Add Photo
            </button>
            
            <div id="auth-status" class="text-xs text-center text-gray-400 mt-auto">Connecting to network...</div>
        </div>
    </aside>

    <!-- Main Content Grid -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 w-full h-full bg-gray-50 relative">
        <div id="loading-spinner" class="absolute inset-0 flex items-center justify-center bg-gray-50 z-10">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600"></div>
        </div>
        
        <div id="photo-grid" class="grid grid-cols-2 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 md:gap-6 auto-rows-[200px] md:auto-rows-[250px]">
            <!-- Photos will be dynamically inserted here -->
        </div>
        <div class="h-24 md:h-8"></div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-4 left-1/2 -translate-x-1/2 md:bottom-8 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl flex items-center gap-3 transform translate-y-[150%] opacity-0 transition-all duration-300 z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
        <span class="font-medium text-sm" id="toast-message">Link copied to clipboard!</span>
    </div>

    <!-- Add Photo Modal -->
    <div id="add-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 opacity-0 transition-opacity duration-200">
        <div class="bg-white rounded-2xl p-6 w-full max-w-md shadow-2xl transform scale-95 transition-transform duration-200" id="add-modal-content">
            <h2 class="text-xl font-bold text-gray-900 mb-4">Add a Photo</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Photo URL</label>
                    <input type="url" id="photo-url-input" placeholder="https://example.com/image.jpg" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                    <p class="text-xs text-gray-500 mt-1">Paste a link to an image (e.g. from Unsplash or Imgur).</p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Added By (Your Name)</label>
                    <input type="text" id="added-by-input" placeholder="e.g. Alex" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Caption (Optional)</label>
                    <input type="text" id="caption-input" placeholder="Great memories!" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition-all">
                </div>
            </div>
            <div class="mt-6 flex justify-end gap-3">
                <button onclick="closeAddModal()" class="px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 font-medium transition-colors">Cancel</button>
                <button onclick="submitPhoto()" id="submit-photo-btn" class="px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium shadow-sm transition-colors flex items-center gap-2">
                    Upload
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Environment variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'friendstack-default';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let currentUser = null;
        let unsubscribePhotos = null;

        // Set share link to current URL
        document.getElementById('share-link').value = window.location.href;

        // Authentication flow
        async function initializeAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                document.getElementById('auth-status').innerText = "Authentication failed.";
                document.getElementById('auth-status').classList.add('text-red-500');
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if (user) {
                document.getElementById('auth-status').innerText = "Connected dynamically";
                document.getElementById('auth-status').classList.remove('text-red-500', 'text-gray-400');
                document.getElementById('auth-status').classList.add('text-green-500');
                startPhotoListener();
            } else {
                if (unsubscribePhotos) unsubscribePhotos();
            }
        });

        // Real-time Database Listener
        function startPhotoListener() {
            if (!currentUser) return;

            // MANDATORY RULE: Use strict path for public data
            const photosRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
            
            // MANDATORY RULE: No complex queries. Fetch all and sort in memory.
            unsubscribePhotos = onSnapshot(photosRef, (snapshot) => {
                const photos = [];
                snapshot.forEach((doc) => {
                    photos.push({ id: doc.id, ...doc.data() });
                });

                // Sort in memory by timestamp descending (newest first)
                photos.sort((a, b) => b.timestamp - a.timestamp);
                
                renderPhotos(photos);
                
                document.getElementById('loading-spinner').style.display = 'none';
                document.getElementById('photo-count').innerText = photos.length;
                
                // Add some default dummy photos if empty just for the aesthetic of the MVP
                if (photos.length === 0) {
                     seedInitialPhotos();
                }
            }, (error) => {
                console.error("Error listening to photos:", error);
                showToast("Error loading photos.", true);
            });
        }

        // Render Photos to DOM
        function renderPhotos(photos) {
            const grid = document.getElementById('photo-grid');
            grid.innerHTML = ''; // Clear current grid

            photos.forEach((photo, index) => {
                const card = document.createElement('div');
                
                // Add masonry-like classes based on index to keep the visual interest from the mockup
                let spanClass = "";
                if (index % 7 === 0) spanClass = "row-span-2"; // Make every 7th item tall
                else if (index % 5 === 0) spanClass = "col-span-2"; // Make every 5th item wide
                
                card.className = `photo-card relative rounded-2xl overflow-hidden shadow-sm hover:shadow-xl transition-shadow cursor-pointer group bg-gray-200 ${spanClass}`;
                
                // Ensure text is escaped to prevent XSS
                const safeName = escapeHtml(photo.addedBy || "Anonymous");
                const safeCaption = escapeHtml(photo.caption || "");
                const safeUrl = escapeHtml(photo.url || "");

                card.innerHTML = `
                    <img src="${safeUrl}" alt="Photo by ${safeName}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/e2e8f0/475569?text=Image+Load+Failed'">
                    <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end p-4">
                        <div class="text-white">
                            ${safeCaption ? `<p class="font-medium truncate">${safeCaption}</p>` : ''}
                            <p class="text-xs text-white/80">Added by ${safeName}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Add Photo to Firestore
        window.submitPhoto = async function() {
            if (!currentUser) {
                showToast("You must be connected to add photos.", true);
                return;
            }

            const urlInput = document.getElementById('photo-url-input');
            const nameInput = document.getElementById('added-by-input');
            const captionInput = document.getElementById('caption-input');
            const btn = document.getElementById('submit-photo-btn');

            const url = urlInput.value.trim();
            const name = nameInput.value.trim() || "Anonymous";
            const caption = captionInput.value.trim();

            if (!url) {
                showToast("Please enter a valid image URL.", true);
                return;
            }

            // Simple URL validation
            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                 showToast("URL must start with http:// or https://", true);
                 return;
            }

            btn.disabled = true;
            btn.innerHTML = '<div class="animate-spin rounded-full h-4 w-4 border-b-2 border-white"></div> Uploading...';

            try {
                const photosRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
                await addDoc(photosRef, {
                    url: url,
                    addedBy: name,
                    caption: caption,
                    timestamp: Date.now(),
                    userId: currentUser.uid
                });

                closeAddModal();
                showToast("Photo added successfully!");
                
                // Clear inputs
                urlInput.value = '';
                captionInput.value = '';
                // Intentionally keep 'addedBy' so they don't have to retype their name
            } catch (error) {
                console.error("Error adding photo:", error);
                showToast("Failed to add photo.", true);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Upload';
            }
        };

        // Helpers
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        // Seed some initial data if the collection is completely empty 
        // to ensure the app doesn't look broken on first load.
        async function seedInitialPhotos() {
            if (!currentUser) return;
            const seedData = [
                { url: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?q=80&w=600&auto=format&fit=crop", caption: "Game winning touchdown!", addedBy: "Alex" },
                { url: "https://images.unsplash.com/photo-1511895426328-dc8714191300?q=80&w=600&auto=format&fit=crop", caption: "Cheering crowd", addedBy: "Sam" },
                { url: "https://images.unsplash.com/photo-1523301343968-6a6ebf63c672?q=80&w=1000&auto=format&fit=crop", caption: "Group photo", addedBy: "Jordan" }
            ];

            const photosRef = collection(db, 'artifacts', appId, 'public', 'data', 'photos');
            let time = Date.now();
            
            for (const photo of seedData) {
                try {
                    await addDoc(photosRef, {
                        ...photo,
                        timestamp: time--, // Decrement to maintain order
                        userId: currentUser.uid
                    });
                } catch(e) {
                    console.error("Seed error", e);
                }
            }
        }

        // Start initialization
        initializeAuth();
    </script>

    <!-- UI Interaction Scripts -->
    <script>
        // Copy Link logic
        function copyLink() {
            var copyText = document.getElementById("share-link");
            copyText.select();
            copyText.setSelectionRange(0, 99999);

            try {
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(copyText.value);
                } else {
                    document.execCommand("copy");
                }
                showToast("Link copied to clipboard!");
            } catch (err) {
                console.error('Failed to copy text: ', err);
                showToast("Failed to copy link.", true);
            }
        }

        // Toast logic
        let toastTimeout;
        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toast-message');
            
            msgEl.innerText = message;
            
            // Handle error styling
            const svg = toast.querySelector('svg');
            if (isError) {
                toast.classList.replace('bg-gray-900', 'bg-red-600');
                svg.classList.replace('text-green-400', 'text-white');
                svg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />';
            } else {
                toast.classList.replace('bg-red-600', 'bg-gray-900');
                svg.classList.replace('text-white', 'text-green-400');
                svg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />';
            }
            
            toast.classList.remove('translate-y-[150%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[150%]', 'opacity-0');
            }, 3000);
        }

        // Modal logic
        const modal = document.getElementById('add-modal');
        const modalContent = document.getElementById('add-modal-content');

        function openAddModal() {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // Trigger reflow
            void modal.offsetWidth; 
            
            modal.classList.remove('opacity-0');
            modalContent.classList.remove('scale-95');
        }

        function closeAddModal() {
            modal.classList.add('opacity-0');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        // Close modal on click outside
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                closeAddModal();
            }
        });
    </script>
</body>
</html>
